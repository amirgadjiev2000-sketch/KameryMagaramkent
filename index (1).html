<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Холодильные камеры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#04251f">
<style>
:root{
  color-scheme:light;
  --bg1:#0d5b4b;--bg2:#06372e;--bg3:#020f0d;
  --mint:#b9f4cf;--green:#59c878;--green-2:#1f9e68;--green-dark:#126043;
  --gold:#f4c95d;--danger:#e23b35;--ink:#0b1f1b;--muted:#66746f;
  --card:#ffffff;--card-soft:#f6fbf8;--line:rgba(17,78,58,.14);
  --text-hi:#f6fff9;--text-mid:#c7ead8;
  --shadow-sm:0 8px 22px rgba(3,24,20,.14);
  --shadow:0 18px 45px rgba(1,20,16,.22);
  --shadow-lg:0 26px 70px rgba(0,15,12,.34);
  --radius:24px;--radius-md:18px;--focus:0 0 0 4px rgba(120,224,151,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Manrope','Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:var(--ink);
  background:
    radial-gradient(900px 520px at 12% -8%, rgba(145,241,176,.30), transparent 58%),
    radial-gradient(780px 420px at 95% 8%, rgba(82,199,153,.16), transparent 62%),
    radial-gradient(900px 700px at 50% 120%, rgba(244,201,93,.12), transparent 62%),
    linear-gradient(145deg,var(--bg1) 0%,var(--bg2) 42%,var(--bg3) 100%);
  background-attachment:fixed;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background-image:
  linear-gradient(rgba(255,255,255,.032) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,.032) 1px, transparent 1px);
  background-size:42px 42px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 82%)}
body:after{content:"";position:fixed;inset:auto -15% -35% -15%;height:46vh;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center,rgba(118,226,154,.18),transparent 70%);filter:blur(4px)}
.app{width:min(100% - 44px,1250px);margin:auto;padding:22px 0 34px}
.brandbar{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 22px;position:relative}
.brandbar:after{content:"Система контроля холодильных камер";margin-top:12px;padding:7px 14px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.08);backdrop-filter:blur(14px);color:rgba(246,255,249,.88);font-weight:700;font-size:12px;letter-spacing:.03em;text-transform:uppercase}
.brand-logo{height:86px;width:auto;max-width:min(92vw,520px);object-fit:contain;filter:drop-shadow(0 18px 30px rgba(0,0,0,.38))}
.header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:0 0 20px;padding:18px;border:1px solid rgba(255,255,255,.16);border-radius:var(--radius);background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.06));box-shadow:var(--shadow);backdrop-filter:blur(18px)}
.header>div:last-child{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
h1,h2{margin:0;font-family:'Unbounded','Manrope',Arial,sans-serif;color:var(--text-hi);letter-spacing:-.035em;line-height:1.08;text-wrap:balance;text-shadow:0 10px 28px rgba(0,0,0,.23)}
h1{font-weight:800;font-size:clamp(28px,4.4vw,54px)}h2{font-weight:800;font-size:clamp(24px,3.2vw,40px)}
.sub{font-size:14px;color:var(--text-mid);margin-top:9px;font-weight:600}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{font-family:'Unbounded','Manrope',Arial,sans-serif;font-weight:700;font-size:12px;letter-spacing:-.01em;border:1px solid rgba(255,255,255,.42);background:linear-gradient(180deg,#fff,#eff8f2);color:var(--ink);border-radius:16px;padding:12px 17px;min-height:46px;transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease;box-shadow:0 10px 22px rgba(1,20,16,.18),inset 0 1px 0 rgba(255,255,255,.82)}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 30px rgba(1,20,16,.28),inset 0 1px 0 rgba(255,255,255,.9)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:focus-visible,.cam:focus-visible,.color:focus-visible,input:focus-visible{outline:none;box-shadow:var(--focus),0 12px 28px rgba(1,20,16,.22)}
.primary{background:linear-gradient(135deg,#61d581 0%,#239966 46%,#126043 100%);color:#fff;border-color:rgba(185,244,207,.38);box-shadow:0 14px 30px rgba(27,153,101,.32),inset 0 1px 0 rgba(255,255,255,.24)}
.greenbtn{background:linear-gradient(135deg,#f0fff5,#d6f7e0);color:#11583f;border-color:rgba(185,244,207,.75)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;align-items:stretch}
.cam{min-height:158px;background:linear-gradient(160deg,rgba(255,255,255,.98),rgba(241,250,245,.95));border:1px solid rgba(255,255,255,.76);border-radius:26px;padding:21px;text-align:left;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;isolation:isolate}
.cam:before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:linear-gradient(90deg,var(--green-dark),var(--green),var(--mint));opacity:.98}
.cam:after{content:"";position:absolute;width:145px;height:145px;right:-62px;bottom:-70px;border-radius:50%;background:radial-gradient(circle,rgba(89,200,120,.20),transparent 68%);z-index:-1}
.cam:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:rgba(185,244,207,.9)}
.camtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.camtop b{font-family:'Unbounded','Manrope',Arial,sans-serif;font-weight:800;font-size:15px;line-height:1.18}
.badge{font-size:11px;padding:6px 10px;border-radius:999px;background:#eef3f6;color:#63736e;font-weight:800;white-space:nowrap;border:1px solid rgba(11,31,27,.05)}
.done{background:linear-gradient(135deg,#dcfae7,#bdf2d0);color:#116b42;border-color:#a5e7bd}
.temp{font-family:'Unbounded','Manrope',Arial,sans-serif;font-size:clamp(27px,4vw,36px);font-weight:800;margin:20px 0 10px;color:var(--ink);letter-spacing:-.04em}
.small{font-size:13px;color:var(--muted);font-weight:600;line-height:1.45}.page{display:none;animation:fadeIn .24s ease both}.page.active{display:block}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.info{display:grid;grid-template-columns:minmax(0,2fr) minmax(160px,1fr) minmax(180px,1fr);gap:14px;margin:18px 0}
.field{background:linear-gradient(180deg,#fff,#f8fcfa);border:1px solid rgba(255,255,255,.76);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow-sm)}
.field label{display:block;font-size:11px;color:#6a7974;margin-bottom:6px;font-weight:800;text-transform:uppercase;letter-spacing:.055em}.field input{width:100%;border:0;outline:0;background:transparent;font-size:16px;font-family:'Manrope','Inter',Arial,sans-serif;color:var(--ink);font-weight:700;min-height:26px}.field:focus-within{border-color:#9ee8b7;box-shadow:var(--focus),var(--shadow-sm)}
.fresh{background:linear-gradient(180deg,#fff,#f8fcfa);border:1px solid rgba(255,255,255,.76);border-radius:18px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow-sm)}
.fresh label{font-size:15px;display:flex;align-items:center;gap:10px;font-weight:800}.fresh input[type="checkbox"]{width:20px;height:20px;accent-color:var(--green-2)}.fresh-date{border:1px solid var(--line);border-radius:12px;padding:10px 11px;font-family:'Manrope','Inter',Arial,sans-serif;font-weight:700;min-height:42px;background:#fff;color:var(--ink)}
.scheme{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(246,251,248,.98));border:1px solid rgba(255,255,255,.82);border-radius:28px;padding:20px;box-shadow:var(--shadow-lg);overflow:hidden}.schemehead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.schemehead b{font-family:'Unbounded','Manrope',Arial,sans-serif;font-weight:800;font-size:16px}.schemehead .small{max-width:780px}
.room{position:relative;height:clamp(430px,58vh,590px);border:1px solid rgba(20,47,42,.28);border-radius:22px;background:
  linear-gradient(rgba(26,91,71,.045) 1px, transparent 1px),
  linear-gradient(90deg, rgba(26,91,71,.045) 1px, transparent 1px),
  radial-gradient(700px 350px at 50% 0%,#ffffff,#f3f8f5 74%);background-size:34px 34px,34px 34px,auto;overflow:hidden;touch-action:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.88),inset 0 18px 50px rgba(9,44,34,.06)}
.room:before{content:"";position:absolute;inset:16px;border:1px dashed rgba(34,83,67,.28);border-radius:14px;pointer-events:none}.roomlabel{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:11px;color:#70807a;font-weight:900;letter-spacing:.14em;background:rgba(255,255,255,.78);border:1px solid rgba(17,78,58,.10);border-radius:999px;padding:5px 12px;backdrop-filter:blur(8px)}
.square{position:absolute;width:46px;height:46px;border:2px solid rgba(255,255,255,.88);border-radius:12px;color:#fff;font-size:7px;line-height:1.08;padding:3px;white-space:pre-line;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;user-select:none;touch-action:none;box-shadow:0 8px 16px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.20);transition:transform .12s ease,box-shadow .12s ease,outline-color .12s ease}.square:hover{transform:scale(1.06);z-index:3}.s-green{background:linear-gradient(135deg,#2fd667,#138f43)}.s-yellow{background:linear-gradient(135deg,#ffd957,#d99f00);color:#151100;border-color:rgba(255,255,255,.9)}.s-red{background:linear-gradient(135deg,#ff695f,#c91f19)}.s-black{background:linear-gradient(135deg,#2a302e,#050707)}.selected{outline:4px solid #79e69b;outline-offset:2px;box-shadow:0 0 0 7px rgba(121,230,155,.18),0 13px 24px rgba(0,0,0,.30);z-index:4}
.marquee{position:absolute;border:2px dashed #126043;background:rgba(55,193,111,.12);pointer-events:none;z-index:5;border-radius:10px}.editor{display:grid;grid-template-columns:minmax(200px,1.8fr) minmax(95px,.7fr) minmax(115px,.8fr) auto auto auto;gap:10px;margin-top:14px;align-items:end}.colors{display:flex;gap:7px;align-items:center;justify-content:center;min-height:46px}.color{width:38px;height:38px;border-radius:13px;border:2px solid rgba(255,255,255,.95);box-shadow:0 8px 16px rgba(1,20,16,.16);transition:transform .15s ease,outline-color .15s ease}.color:hover{transform:translateY(-2px)}.color.active{outline:4px solid rgba(18,96,67,.92);outline-offset:2px}.color.green{background:linear-gradient(135deg,#2fd667,#138f43)}.color.yellow{background:linear-gradient(135deg,#ffd957,#d99f00)}.color.red{background:linear-gradient(135deg,#ff695f,#c91f19)}.color.black{background:linear-gradient(135deg,#2a302e,#050707)}
.hint{font-size:12px;color:var(--muted);margin-top:8px}.tablewrap{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(246,251,248,.98));border:1px solid rgba(255,255,255,.82);border-radius:28px;padding:18px;overflow:auto;box-shadow:var(--shadow-lg);-webkit-overflow-scrolling:touch}.restable{border-collapse:separate;border-spacing:0;width:100%;min-width:850px}.restable th,.restable td{border:0;border-bottom:1px solid var(--line);padding:10px}.restable tr:last-child td{border-bottom:0}.restable input{border:1px solid rgba(17,78,58,.12);border-radius:13px;padding:10px;width:100%;font-family:'Manrope','Inter',Arial,sans-serif;font-weight:700;background:#fff;color:var(--ink)}.restable input:focus{outline:none;border-color:#9ee8b7;box-shadow:var(--focus)}.restable th{position:sticky;top:0;z-index:1;background:#f4faf6;white-space:nowrap;font-family:'Unbounded','Manrope',Arial,sans-serif;font-size:12px;color:#123c31}.restable th:first-child,.restable td:first-child{position:sticky;left:0;background:#f7fbf8;z-index:2;font-weight:900}.restable th:first-child{z-index:3}.restable th input{border:0;background:transparent;font:inherit;font-weight:800;width:auto;min-width:60px;padding:4px}.colx{background:none;border:0;color:#c43228;cursor:pointer;font-size:16px;margin-left:4px;font-weight:900;vertical-align:middle}
@media(max-width:980px){.app{width:min(100% - 28px,1250px);padding-top:16px}.header{align-items:stretch}.header>div:last-child{justify-content:flex-start}.info{grid-template-columns:1fr 1fr}.info .field:first-child{grid-column:1/-1}.editor{grid-template-columns:1fr 1fr}.editor .field:first-child{grid-column:1/-1}.colors{justify-content:flex-start}.schemehead .small{font-size:12px}.grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}}
@media(max-width:640px){body{background-attachment:scroll}.app{width:min(100% - 18px,1250px);padding:10px 0 22px}.brandbar{padding:8px 0 14px}.brandbar:after{font-size:10px;text-align:center;line-height:1.35}.brand-logo{height:58px}.header{padding:14px;border-radius:22px;margin-bottom:14px;align-items:stretch}.header>div{width:100%}.header>div:last-child{display:grid;grid-template-columns:1fr;gap:8px}.btn{width:100%;padding:12px 14px;min-height:48px}.grid{grid-template-columns:1fr;gap:12px}.cam{min-height:132px;padding:18px;border-radius:22px}.temp{margin:16px 0 8px}.info{grid-template-columns:1fr;gap:10px;margin:12px 0}.fresh{border-radius:16px;padding:13px}.fresh-date{width:100%}.scheme{border-radius:24px;padding:13px;margin-left:-2px;margin-right:-2px}.schemehead{margin-bottom:11px}.room{height:min(112vw,500px);min-height:360px;border-radius:18px;background-size:28px 28px,28px 28px,auto}.room:before{inset:11px;border-radius:12px}.roomlabel{top:8px;font-size:10px}.square{width:44px;height:44px;border-radius:11px;font-size:6.6px}.editor{grid-template-columns:1fr;gap:9px;margin-top:11px}.colors{justify-content:space-between;background:#fff;border:1px solid rgba(17,78,58,.10);border-radius:16px;padding:8px}.color{width:44px;height:44px}.tablewrap{border-radius:22px;padding:10px;margin-left:-2px;margin-right:-2px}.restable{min-width:760px}.restable th,.restable td{padding:8px}.restable input{padding:9px}.sub{font-size:13px}}
@media(max-width:380px){.brand-logo{height:50px}.camtop{flex-direction:column}.badge{width:max-content}.square{width:40px;height:40px;font-size:6px}.room{min-height:340px}.restable{min-width:700px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}}
@media print{body{background:#fff}.brandbar:after,.header,.fresh,.editor,#deleteSquares,.btn{display:none!important}.app{width:100%;padding:0}.page{display:block}.grid{display:none}.scheme,.tablewrap,.field{box-shadow:none;border-color:#cfd8d2}.room{height:520px;background:#fff}.square{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style>
</head>

<script>
(function(){
'use strict';
var CK='cold_cameras_v5', LK='cold_leftovers_v5', LCK='cold_leftover_cols_v5';
function freshCameras(){var a=[];for(var i=1;i<=20;i++)a.push({id:i,content:'',temp:'',date:'',fresh:false,freshDate:'',squares:[]});return a;}
function read(k,d){try{var x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}}
function defaultColumns(){return [
 {key:'product',label:'Продукт'},
 {key:'camera',label:'Камера'},
 {key:'rows',label:'Ряды'},
 {key:'height',label:'Высота, м'},
 {key:'amount',label:'Остаток'},
 {key:'note',label:'Примечание'}
];}
var embedded=document.getElementById('APP_DATA').textContent.trim();
var pack=null;try{pack=embedded?JSON.parse(embedded):null}catch(e){pack=null}
var cameras=pack&&Array.isArray(pack.cameras)?pack.cameras:read(CK,null);
if(!Array.isArray(cameras)||cameras.length!==20)cameras=freshCameras();
var leftovers=pack&&Array.isArray(pack.leftovers)?pack.leftovers:read(LK,[]);
if(!Array.isArray(leftovers))leftovers=[];
var leftoverColumns=pack&&Array.isArray(pack.leftoverColumns)&&pack.leftoverColumns.length?pack.leftoverColumns:read(LCK,null);
if(!Array.isArray(leftoverColumns)||!leftoverColumns.length)leftoverColumns=defaultColumns();
var current=null, selected={}, pending='black', drag=null, placementRow=0, placementCol=0;
var marqueeBox=null, marqueeStart=null, marqueeRect=null, marqueeBase=null;

function id(x){return document.getElementById(x)}
function persist(){try{localStorage.setItem(CK,JSON.stringify(cameras));localStorage.setItem(LK,JSON.stringify(leftovers));localStorage.setItem(LCK,JSON.stringify(leftoverColumns))}catch(e){}}
function show(which){['home','cameraPage','leftoversPage'].forEach(function(x){id(x).classList.remove('active')});id(which).classList.add('active')}
function renderHome(){
 var g=id('cameraGrid');g.innerHTML='';
 cameras.forEach(function(c){
   var b=document.createElement('button');b.className='cam';b.type='button';
   b.innerHTML='<div class="camtop"><b>Камера '+c.id+'</b><span class="badge '+(c.fresh?'done':'')+'">'+(c.fresh?'Обработано':'Не обработано')+'</span></div><div class="temp">'+(c.temp||'—')+'</div><div class="small">'+(c.content||'Нет данных')+'</div>';
   b.onclick=function(){openCamera(c.id)};g.appendChild(b);
 });
}
function openCamera(n){
 current=cameras[n-1];selected={};pending='black';placementRow=0;placementCol=0;
 id('cameraTitle').textContent='Камера '+current.id;
 id('content').value=current.content||'';id('temp').value=current.temp||'';id('startDate').value=current.date||'';
 id('freshCheck').checked=!!current.fresh;id('freshDate').value=current.freshDate||'';
 id('product').value='';id('rows').value='';id('height').value='';
 updateColors();renderSquares();show('cameraPage');
}
function saveCurrent(){
 if(!current)return;
 current.content=id('content').value.trim();current.temp=id('temp').value.trim();current.date=id('startDate').value;
 current.fresh=id('freshCheck').checked;current.freshDate=id('freshDate').value;persist();
}
function updateColors(){document.querySelectorAll('.color').forEach(function(b){b.classList.toggle('active',b.dataset.color===pending)})}
function renderSquares(){
 id('room').querySelectorAll('.square').forEach(function(x){x.remove()});
 current.squares.forEach(function(s,i){
   var b=document.createElement('button');b.type='button';
   b.className='square s-'+(s.color||'black')+(selected[i]?' selected':'');
   b.dataset.index=i;
   b.style.left=(typeof s.x==='number'?s.x:2)+'%';
   b.style.top=(typeof s.y==='number'?s.y:3)+'%';
   b.textContent=(s.product||'Продукт')+'\n'+(s.rows||1)+' р.\n'+(s.height||0)+' м';

   b.onclick=function(e){
     e.stopPropagation();
     if(e.ctrlKey||e.metaKey){
       selected[i]=!selected[i];
     }else{
       selected={}; selected[i]=true;
       id('product').value=s.product||'';
       id('rows').value=s.rows||'';
       id('height').value=s.height||'';
     }
     renderSquares();
   };

   b.onpointerdown=function(e){
     e.preventDefault();
     // IMPORTANT: do not rebuild the DOM here; that caused squares to jump.
     if(!selected[i]){
       selected={}; selected[i]=true;
       id('product').value=s.product||'';
       id('rows').value=s.rows||'';
       id('height').value=s.height||'';
       b.classList.add('selected');
     }
     var rr=id('room').getBoundingClientRect();
     var br=b.getBoundingClientRect();
     drag={
       index:i,
       dx:e.clientX-br.left,
       dy:e.clientY-br.top,
       rect:rr,
       moved:false
     };
     try{b.setPointerCapture(e.pointerId)}catch(err){}
   };

   b.onpointermove=function(e){
     if(!drag||drag.index!==i)return;
     var r=drag.rect;
     var nx=Math.max(0,Math.min(92,(e.clientX-r.left-drag.dx)/r.width*100));
     var ny=Math.max(0,Math.min(88,(e.clientY-r.top-drag.dy)/r.height*100));
     if(Math.abs(nx-(s.x||0))>.05 || Math.abs(ny-(s.y||0))>.05) drag.moved=true;

   };

     if(drag&&drag.index===i){

function roomSquares(){return Array.prototype.slice.call(id('room').querySelectorAll('.square'))}

function initMarquee(){
 var room=id('room');
 room.addEventListener('pointerdown',function(e){
   if(e.target.closest('.square'))return;
   if(!current)return;
   e.preventDefault();
   marqueeRect=room.getBoundingClientRect();
   marqueeStart={x:e.clientX,y:e.clientY};
   marqueeBase=(e.ctrlKey||e.metaKey)?Object.assign({},selected):{};
   marqueeBox=document.createElement('div');
   marqueeBox.className='marquee';
   marqueeBox.style.left='0px';marqueeBox.style.top='0px';marqueeBox.style.width='0px';marqueeBox.style.height='0px';
   room.appendChild(marqueeBox);
   try{room.setPointerCapture(e.pointerId)}catch(err){}
 });
 room.addEventListener('pointermove',function(e){
   if(!marqueeBox)return;
   var r=marqueeRect;
   var x1=Math.min(marqueeStart.x,e.clientX)-r.left, x2=Math.max(marqueeStart.x,e.clientX)-r.left;
   var y1=Math.min(marqueeStart.y,e.clientY)-r.top, y2=Math.max(marqueeStart.y,e.clientY)-r.top;
   marqueeBox.style.left=x1+'px';marqueeBox.style.top=y1+'px';
   marqueeBox.style.width=(x2-x1)+'px';marqueeBox.style.height=(y2-y1)+'px';
   var newSel=Object.assign({},marqueeBase);
   roomSquares().forEach(function(sq){
     var br=sq.getBoundingClientRect();
     var sx1=br.left-r.left, sx2=br.right-r.left, sy1=br.top-r.top, sy2=br.bottom-r.top;
     var overlap=!(sx2<x1||sx1>x2||sy2<y1||sy1>y2);
     if(overlap)newSel[Number(sq.dataset.index)]=true;
   });
   selected=newSel;
   roomSquares().forEach(function(sq){sq.classList.toggle('selected',!!selected[Number(sq.dataset.index)])});
 });
 function finishMarquee(){
   if(!marqueeBox)return;
   marqueeBox.remove();marqueeBox=null;
   var keys=Object.keys(selected);
   if(keys.length===1&&current){
     var s=current.squares[Number(keys[0])];
     id('product').value=s.product||'';id('rows').value=s.rows||'';id('height').value=s.height||'';
   }
   renderSquares();
 }
 room.addEventListener('pointerup',finishMarquee);
 room.addEventListener('pointercancel',finishMarquee);
}

function addSquare(){

     r=Math.max(1,parseInt(id('rows').value,10)||1),
     h=Math.max(0,parseFloat(id('height').value)||0);

   keys.forEach(function(k){
     var ss=current.squares[Number(k)];
     ss.product=p;ss.rows=r;ss.height=Number(h.toFixed(1));ss.color=pending;
   });
 }else{
   var x=2+(placementCol*4.1);
   var y=3+(placementRow*8.8);
   current.squares.push({
     product:p,rows:r,height:Number(h.toFixed(1)),color:pending,
     x:Math.min(92,x),y:Math.min(88,y)
   });
   placementCol++;
   if(placementCol>=22){placementCol=0;placementRow++}
 }
 selected={};
 id('product').value='';id('rows').value='';id('height').value='';
 saveCurrent();renderSquares();renderHome();
}
